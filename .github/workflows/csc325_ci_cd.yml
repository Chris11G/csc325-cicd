name: CSC325 CI/CD Pipeline

# Runs automatically on every push to main (and can be started by hand).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"   # change to match the version used in the tutorial

jobs:
  # Stage 1: check out the code and install Python
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Show Python version
        run: python3 --version

  # Stage 2: install packages (fails the run if any dependency can't install)
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Django system check
        run: python3 manage.py check

  # Stage 3: run the full test suite; any failing test fails the pipeline
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run tests
        run: python3 manage.py test --verbosity 2

  # Stage 4: deploy - only runs if every test passed (needs: test)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "All tests passed - deploying commit ${{ github.sha }}"
          echo "Deployed by ${{ github.actor }} at $(date -u)"
      # Optional extra credit: real deploy to Render.
      # Add a repo secret RENDER_DEPLOY_HOOK_URL (Settings > Secrets > Actions)
      # with the Deploy Hook URL from your Render service.
      - name: Trigger Render deploy (optional)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
